[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gsd-path-daemon"
dynamic = ["version"]
description = "Progress-monitoring daemon and tray app for GSD Path projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["markdown-it-py"]
license = { text = "MIT" }

[project.optional-dependencies]
tray = ["pystray", "Pillow"]

[project.scripts]
gsd-path-daemon = "gsd_daemon.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "gsd_daemon.__version__" }

[tool.setuptools.packages.find]
include = ["gsd_daemon*"]
