name: App release

# Builds the OpenGSD Path desktop app (daemon/app) and attaches the installers
# to a GitHub pre-release. Builds are unsigned (macOS: ad-hoc), so they are for
# testers only; see docs/adr/0005-native-dashboard-app.md.
#
# It also signs the update files with the updater key (repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and, when
# every platform built, replaces latest.json on the fixed app-latest
# pre-release. Installed apps read that file to find the update.
#
# Trigger: push a tag app-v<version>, where <version> is the version in
# daemon/app/src-tauri/tauri.conf.json:
#   git tag app-v0.1.0 && git push origin app-v0.1.0
# The npm release workflow runs on v* tags only, so an app-v* tag never publishes to npm.

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the app version
        run: |
          set -euo pipefail
          version="$(node -p "require('./daemon/app/src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_NAME" != "app-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --prerelease --title "OpenGSD Path app ${GITHUB_REF_NAME#app-v}" \
            --notes "Tester build. Unsigned: macOS asks for approval in Privacy & Security, and Windows shows a SmartScreen warning."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `updates`: one or more `<platform>=<ext>`. The platform is the name the app's updater asks
          # for; the ext is the file it installs.
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            updates: darwin-aarch64=app.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            updates: darwin-x86_64=app.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            updates: windows-x86_64=msi
          # An app installed from the .deb can install only a .deb.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            updates: linux-x86_64=AppImage linux-x86_64-deb=deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        # Update files are made only here: a local build has no signing key.
        run: >
          npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/**/*.{dmg,msi,deb,AppImage})
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "the build made no installer" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - name: Upload the signed update files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          # One update file and one signature per platform, under a fixed name that latest.json points to.
          for update in ${{ matrix.updates }}; do
            platform="${update%%=*}"
            ext="${update#*=}"
            found=(src-tauri/target/${{ matrix.target }}/release/bundle/**/*."$ext")
            if [[ ${#found[@]} -ne 1 || ! -f "${found[0]}.sig" ]]; then
              echo "expected one signed .$ext update file, found: ${found[*]:-none}" >&2
              exit 1
            fi
            name="updater-$platform.$ext"
            cp "${found[0]}" "$name"
            cp "${found[0]}.sig" "$name.sig"
            gh release upload "$GITHUB_REF_NAME" "$name" "$name.sig" --clobber
          done

  # Runs only when every platform built, so latest.json never names a missing file.
  publish-update:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Replace latest.json on the app-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir signatures
          gh release download "$GITHUB_REF_NAME" --pattern 'updater-*.sig' --dir signatures
          node daemon/app/scripts/latest-json.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" signatures > latest.json
          cat latest.json
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease \
            --title "OpenGSD Path app: update channel" \
            --notes "Holds latest.json, the file installed apps read to find an update. Download the app from the newest app-v release."
          gh release upload app-latest latest.json --clobber
